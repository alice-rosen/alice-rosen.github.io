<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body{% if page.url == '/' %} class="home-page"{% endif %}>

  {% if site.data.settings.google_analytics %}
    {% include google-analytics.html %}
  {% endif %}

  {% include header.html %}

  <!-- begin content -->
  <main class="content" aria-label="Content">
    {{ content }}
  </main>
  <!-- end content -->

  {% include subscribe.html %}

  {% include footer.html %}

  <script src="{{ site.baseurl }}/js/scripts.js"></script>
  <script src="{{ site.baseurl }}/js/common.js"></script>
  <script src="{{ site.baseurl }}/js/publications.js"></script>
  <script src="{{ site.baseurl }}/js/project-filters.js?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ site.baseurl }}/js/image-comparisons.js"></script>
  <script src="{{ site.baseurl }}/js/project-citations.js"></script>
</body>

</html>
